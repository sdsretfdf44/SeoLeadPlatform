services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seoleadplatform}
      POSTGRES_USER: ${POSTGRES_USER:-seolead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seolead}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seolead}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SeoLeadPlatform.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-seoleadplatform};Username=${POSTGRES_USER:-seolead};Password=${POSTGRES_PASSWORD:-seolead}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-change-me-in-production-please-32-chars-long-min}
      Jwt__Issuer: SeoLeadPlatform
      Jwt__Audience: SeoLeadPlatform.Client
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost
      Database__AutoMigrate: "true"
    ports:
      - "5080:8080"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
